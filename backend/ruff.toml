# Lint for real errors (syntax, undefined names, unused imports), not style.
extend-exclude = ["app/vendor"]

[lint]
select = ["E4", "E7", "E9", "F"]
# TODO(#1): unused locals (F841) and one ambiguous name (E741). Remove these
# ignores once they are cleaned up: https://github.com/Muddasirr/courtlens/issues/1
ignore = ["F841", "E741"]
