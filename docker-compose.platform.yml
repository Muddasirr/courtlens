# SportLens platform: one URL for futsal + padel.
#
#   cp .env.platform.example .env.platform   # fill in secrets
#   DOCKER_CONTEXT=default docker compose -p sportlens -f docker-compose.platform.yml --env-file .env.platform up -d --build
#   -> http://localhost:${GATEWAY_PORT:-8080}
#
# Separate project (-p sportlens), database, Redis and volumes from the dev stack in docker-compose.yml, so its
# worker never sees the dev queue (a worker re-queues/fails "running" jobs it finds at start-up).
# Only the gateway publishes a port.

x-core-env: &core-env
  DATABASE_URL: postgresql+psycopg://sportlens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/sportlens
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  LOCAL_STORAGE_PATH: /data/videos
  # signed upload/playback URLs point at the gateway
  API_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  YOLO_MODEL: yolov8m.pt
  VISION_DEVICE: cpu
  VISION_TARGET_FPS: "10"
  COURT_FORMAT: ${COURT_FORMAT:-5v5}
  ALLOW_SINGLE_CAMERA: "true"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sportlens
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportlens -d sportlens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]  # queue survives a restart
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Core API: users, facilities, roles, share links + the futsal product (backend/)
  core-api:
    build: { context: ./backend, dockerfile: Dockerfile }
    image: sportlens/core:latest
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${CORE_API_WORKERS:-2}", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *core-env
      VISION_BACKEND: yolo
    volumes:
      - videos:/data/videos
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Futsal processing worker (Redis queue + durable job rows). GPU work goes to Kaggle (account muddasirr).
  # Scale out: docker compose ... up -d --scale core-worker=N
  core-worker:
    image: sportlens/core:latest
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runner"]
    environment:
      <<: *core-env
      VISION_BACKEND: ${VISION_BACKEND:-kaggle}
      TDEED_REPO: /app/data/third_party/tdeed
      TDEED_WEIGHTS: /app/models/tdeed_futsal.pt
      TDEED_WEIGHTS_FOOTBALL: /app/models/tdeed_soccertrack.pt
      TDEED_THRESHOLDS: '{"pass": 0.35, "shot": 0.5, "dribble": 0.3}'
      VISION_MAX_FRAMES: "0"
      VISION_JERSEY_OCR: "1"
    volumes:
      - videos:/data/videos
      - ./backend/data/third_party:/app/data/third_party:ro
      - ${KAGGLE_CONFIG_DIR:-~/.kaggle}:/root/.kaggle:ro
    depends_on:
      core-api: { condition: service_healthy }

  # Padel service (padel/): own SQLite DB + match files; trusts the core JWT via PADEL_AUTH_URL.
  # GPU work goes to Kaggle (account hadivenix, KAGGLE_API_KEY_LSECOND).
  padel:
    build: { context: ./padel, dockerfile: Dockerfile }
    image: sportlens/padel:latest
    restart: unless-stopped
    environment:
      PADEL_BACKEND: ${PADEL_BACKEND:-kaggle}
      PADEL_AUTH_URL: http://core-api:8000
      PADEL_MEDIA_SECRET: ${PADEL_MEDIA_SECRET:?set PADEL_MEDIA_SECRET}
      PADEL_API_TOKEN: ${PADEL_API_TOKEN:-}
      PADEL_LEGACY_FACILITY: ${PADEL_LEGACY_FACILITY:-}
      PADEL_CORS: ${PUBLIC_URL:-http://localhost:8080}
      KAGGLE_API_KEY_LSECOND: ${KAGGLE_API_KEY_LSECOND:-}
    volumes: [padel_data:/data]
    depends_on:
      core-api: { condition: service_healthy }

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    image: sportlens/gateway:latest
    restart: unless-stopped
    environment:
      CORE_UPSTREAM: core-api:8000
      PADEL_UPSTREAM: padel:8010
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-20g}
      CSP_MEDIA_EXTRA: ${S3_PUBLIC_ENDPOINT:-}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      core-api: { condition: service_healthy }
      padel: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  videos:
  padel_data:
